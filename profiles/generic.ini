; Fallback for unknown Linux handhelds. Copy to <device>.ini, set [device] match,
; then fix key codes (find them with: evtest /dev/input/eventN).
; Linux standard gamepad codes (BTN_SOUTH/EAST/..., BTN_DPAD_*) are used as a best guess.

[device]
name  = Generic Linux Handheld
match =

[input]
gamepad       = pad           ; substring, case-insensitive (e.g. "Gamepad", "joypad")
volume        = vol
headphones    = Headphone
axis_max      = 32767
axis_deadzone = 1200

key.a      = 0x130   ; BTN_SOUTH
key.b      = 0x131   ; BTN_EAST
key.x      = 0x133   ; BTN_NORTH
key.y      = 0x134   ; BTN_WEST
key.l1     = 0x136
key.r1     = 0x137
key.l2     = 0x138
key.r2     = 0x139
key.select = 0x13a
key.start  = 0x13b
key.fn     = 0x13c   ; BTN_MODE
key.l3     = 0x13d
key.r3     = 0x13e
key.up     = 0x220
key.down   = 0x221
key.left   = 0x222
key.right  = 0x223
key.vol_up   = 0x73
key.vol_down = 0x72

[usb]
; Leave empty if the device has no software USB role switch.
role_switch =
udc_state   =
vbus_on     =
vbus_off    =

[audio]
internal_card  = 0
internal_rate  = 48000
usb_rate       = 48000
mux_control    =
volume_control =
