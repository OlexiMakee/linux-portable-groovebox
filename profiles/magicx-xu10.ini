; MagicX XU10 (Rockchip RK3326S, ROCKNIX)
; Key codes verified on hardware against the labels printed on the shell.

[device]
name  = MagicX XU10
match = xu10            ; substring of /proc/device-tree/model

[input]
gamepad       = XU10 Gamepad
volume        = gpio-keys-vol
headphones    = Headphones
axis_max      = 1800
axis_deadzone = 60

key.a      = 0x131
key.b      = 0x133
key.x      = 0x130
key.y      = 0x134
key.l1     = 0x136
key.l2     = 0x139
key.r1     = 0x137
key.r2     = 0x138
key.select = 0x13a
key.start  = 0x13b
key.l3     = 0x13d
key.r3     = 0x13e
key.fn     = 0x2c0
key.up     = 0x220
key.down   = 0x221
key.left   = 0x222
key.right  = 0x223
key.vol_up   = 0x73
key.vol_down = 0x72

[usb]
role_switch = /sys/class/usb_role/ff300000.usb-role-switch/role
udc_state   = /sys/class/udc/ff300000.usb/state
; RK817 PMIC reg 0xb4: OTG_SWITCH (5V VBUS to the OTG port) on / off
vbus_on     = /usr/sbin/i2cset -f -y 0 0x20 0xb4 0x46
vbus_off    = /usr/sbin/i2cset -f -y 0 0x20 0xb4 0x42

[audio]
internal_card  = 0
internal_rate  = 32000   ; RK817 I2S rejects 24000 and rounds to 32000
usb_rate       = 48000
mux_control    = Playback Mux
mux_hp         = HP
mux_spk        = SPK
volume_control = Master Playback Volume
volume_min     = 185     ; below ~185 the RK817 is effectively silent
volume_max     = 255
