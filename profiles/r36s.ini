; R36S / R36H / R35S (Rockchip RK3326, 4x Cortex-A35 @ 1.5 GHz, RK817 PMIC/Codec)
; Native Display: 640x480 IPS (4:3 aspect ratio — 2x integer scale from 320x240 logical canvas)
; Supports ArkOS, ROCKNIX, AmberELEC.

[device]
name  = R36S Handheld
match = r36s|r35s|r36h|rg351mp

[display]
width         = 640
height        = 480
integer_scale = 1

[storage]
data_dir = /roms/groovebox

[input]
gamepad           = retrogame_joypad|OpenSimHardware|odroidgo2|joypad|Gamepad
volume            = gpio-keys|vol
headphones        = Headphones|rk817
has_analog_sticks = 1
axis_max          = 1800
axis_deadzone     = 60

key.a        = 0x131   ; BTN_EAST (R36S A)
key.b        = 0x130   ; BTN_SOUTH (R36S B)
key.x        = 0x133   ; BTN_NORTH (R36S X)
key.y        = 0x134   ; BTN_WEST (R36S Y)
key.l1       = 0x136   ; BTN_TL
key.r1       = 0x137   ; BTN_TR
key.l2       = 0x138   ; BTN_TL2
key.r2       = 0x139   ; BTN_TR2
key.select   = 0x13a   ; BTN_SELECT
key.start    = 0x13b   ; BTN_START
key.fn       = 0x2c0   ; BTN_TRIGGER_HAPPY1 (FN button)
key.l3       = 0x13d   ; BTN_THUMBL
key.r3       = 0x13e   ; BTN_THUMBR
key.up       = 0x220   ; BTN_DPAD_UP (also supports ABS_HAT0Y)
key.down     = 0x221   ; BTN_DPAD_DOWN
key.left     = 0x222   ; BTN_DPAD_LEFT (also supports ABS_HAT0X)
key.right    = 0x223   ; BTN_DPAD_RIGHT
key.vol_up   = 0x73    ; KEY_VOLUMEUP
key.vol_down = 0x72    ; KEY_VOLUMEDOWN

[usb]
role_switch = /sys/class/usb_role/ff300000.usb-role-switch/role
udc_state   = /sys/class/udc/ff300000.usb/state
gadget_conf = /storage/.cache/usbgadget/usbgadget.conf
vbus_on     = /usr/sbin/i2cset -f -y 0 0x20 0xb4 0x46
vbus_off    = /usr/sbin/i2cset -f -y 0 0x20 0xb4 0x42

[audio]
internal_card  = 0
internal_rate  = 32000
usb_rate       = 48000
mux_control    = Playback Mux
mux_hp         = HP
mux_spk        = SPK
volume_control = Master Playback Volume
volume_min     = 185
volume_max     = 255
