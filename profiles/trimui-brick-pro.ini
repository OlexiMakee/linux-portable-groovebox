; Trimui Brick & Trimui Brick Pro (Allwinner A133P, 4x Cortex-A53 @ 1.8 GHz, PowerVR GE8300)
; Native Display: 1024x768 IPS (4:3 aspect ratio — scaled from 320x240 logical canvas)
; Supports TrimUI OS, CrossMix OS, Knulli, NextUI / MinUI.

[device]
name  = Trimui Brick Pro
match = trimui brick|tg3040|trimui|a133p

[display]
width         = 1024
height        = 768
integer_scale = 0

[storage]
data_dir = /mnt/SDCARD/Roms/groovebox

[input]
gamepad           = trimui-input|Xbox 360|Gamepad|joypad
volume            = gpio-keys|vol
headphones        = Headphone|audiocodec|jack
has_analog_sticks = 1
axis_max          = 32767
axis_deadzone     = 1200

key.a        = 0x131   ; BTN_EAST (Trimui A)
key.b        = 0x130   ; BTN_SOUTH (Trimui B)
key.x        = 0x134   ; BTN_WEST (Trimui X)
key.y        = 0x133   ; BTN_NORTH (Trimui Y)
key.l1       = 0x136   ; BTN_TL
key.r1       = 0x137   ; BTN_TR
key.l2       = 0x138   ; BTN_TL2
key.r2       = 0x139   ; BTN_TR2
key.select   = 0x13a   ; BTN_SELECT
key.start    = 0x13b   ; BTN_START
key.fn       = 0x13c   ; BTN_MODE (Menu / Fn button)
key.l3       = 0x13d   ; BTN_THUMBL (Brick Pro Hall Stick L3)
key.r3       = 0x13e   ; BTN_THUMBR (Brick Pro Hall Stick R3)
key.up       = 0x220   ; BTN_DPAD_UP (also supports ABS_HAT0Y)
key.down     = 0x221   ; BTN_DPAD_DOWN
key.left     = 0x222   ; BTN_DPAD_LEFT (also supports ABS_HAT0X)
key.right    = 0x223   ; BTN_DPAD_RIGHT
key.vol_up   = 0x73    ; KEY_VOLUMEUP
key.vol_down = 0x72    ; KEY_VOLUMEDOWN

[usb]
; Allwinner A133P sunxi USB OTG role switch (if exposed by kernel)
role_switch = /sys/devices/platform/soc/5100000.udc-controller/otg_role
udc_state   =
vbus_on     =
vbus_off    =

[audio]
internal_card  = 0
internal_rate  = 48000   ; Allwinner sunxi-codec native 48 kHz
usb_rate       = 48000
mux_control    =
volume_control = digital volume
volume_min     = 0
volume_max     = 63
